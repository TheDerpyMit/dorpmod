# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings - re-generated from original MDK defaults.
# Works for 1.21 / 1.21.1. See https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21
parchment_mappings_version=2024.11.10

# Environment Properties - recovered from META-INF/neoforge.mods.toml in dorp-1.63.jar
# MC 1.21.1, NeoForge minimum 21.1.234 (mods.toml: versionRange="[21.1.234,)")
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.234
loader_version_range=[1,)

## Mod Properties - recovered from jar
mod_id=dorp
mod_name=dorp mod
mod_license=MIT
mod_version=1.83
mod_group_id=com.dorp

# Dependency versions - all satisfy ranges in META-INF/neoforge.mods.toml.
# Update these to the EXACT files you built 1.63 against if compile errors appear.
curios_version=9.5.1+1.21.1
create_version=6.0.10
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
jei_version=19.21.1.304
rpl_version=2.1.2
# CurseMaven file IDs (curse.maven:<slug>:<fileId>). 5.11.6 = 8208458, 5.11.0 = 7642335
cbc_file_id=8208458
# Sable / s_a_b - must satisfy [1.4.3,). 2.0.5 is latest 1.21.1 NeoForge as of rebuild.
sable_version=2.0.5
# LambDynLights 4.x (CLIENT). Fill exact version from your mods folder if needed.
lambdynlights_version=4.1.0+1.21.1
# Optional / hard-to-resolve - prefer libs/*.jar drop-in (see build.gradle + libs/README.txt).
# These are hints only and intentionally NOT referenced by build.gradle:
ars_nouveau_version=5.8.0
immersivecomputing_version=UNUSED_SEE_LIBS_README
